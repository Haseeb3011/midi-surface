[package]
name = "midi-surface"
version = "0.1.0"
description = "Touch-first MIDI control surface"
authors = ["MIDI Surface"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "midi_surface_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
